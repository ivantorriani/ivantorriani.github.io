    <nav>
      <a href="index.html">About</a>

  </div>

<audio id="amusician-song" preload="auto">
  <source src="graphics/comegethis.mp3" type="audio/mpeg" />
</audio>

<main>

<section class="intro intro--video">
  <video class="section-video" autoplay muted loop playsinline preload="metadata">
    <source src="graphics/beauty.mp4" type="video/mp4" />
  </video>
</section>

<section class="intro">
  <article class="blueabout blueabout--refined" aria-label="About Ivan Torriani">
    <div class="blueabout-body">
      <h1>I AM IVAN TORRIANI</h1>
    </div>
  </article>
</section>

<section class="intro">
  <div class="blueabout-body bio-box">
    <div class="bio-row">
      <img src="graphics/amusicianstory.png" alt="" class="bio-smore" id="amusician-btn" role="button" tabindex="0">
      <div class="bio-text">
      </div>
    </div>
  </div>
</section>

</main>

<footer>
  <p>&copy; 2025 Ivan </p>
</footer>

<script>
  const musicBtn = document.getElementById("amusician-btn");
  const musicSong = document.getElementById("amusician-song");

  if (musicBtn && musicSong) {
    function toggleMusic() {
      if (musicSong.paused) {
        const bg = document.getElementById("bg-music");
        if (bg && !bg.paused) bg.pause();

        musicSong.play().catch(() => {});
      } else {
        musicSong.pause();
      }
    }

    musicBtn.addEventListener("click", toggleMusic);

    musicBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleMusic();
      }
    });
  }
</script>

</body>
