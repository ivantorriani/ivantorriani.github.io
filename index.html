<script>
  const sittingBtn = document.getElementById("sittingman-btn");
  const sittingSong = document.getElementById("sittingman-song");

  if (sittingBtn && sittingSong) {
    function toggleSong() {
      if (sittingSong.paused) {
        // optional: stop the background music so they don't overlap
        const bg = document.getElementById("bg-music");
        if (bg && !bg.paused) bg.pause();

        sittingSong.play().catch(() => {});
      } else {
        sittingSong.pause();
      }
    }

    sittingBtn.addEventListener("click", toggleSong);

    // keyboard accessibility (Enter/Space)
    sittingBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleSong();
      }
    });
  }
</script>


<script>
  const musicBtn = document.getElementById("amusician-btn");
  const musicSong = document.getElementById("amusician-song");

  if (musicBtn && musicSong) {
    function toggleMusic() {
      if (musicSong.paused) {
        const bg = document.getElementById("bg-music");
        if (bg && !bg.paused) bg.pause();

        musicSong.play().catch(() => {});
      } else {
        musicSong.pause();
      }
    }

    musicBtn.addEventListener("click", toggleMusic);

    musicBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleMusic();
      }
    });
  }
</script>
