<!DOCTYPE html>
<html lang="en">
<head>

  <title>Ivan Torriani</title>
  <link rel="icon" href="/icon_2.png" type="image/x-icon" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 4rem;
      background: #fff;
      font-family: 'Georgia', serif;
      color: #111;
    }

    .card {
      text-align: center;
      padding: 2rem;
    }

    .card h1 {
      font-size: 2.8rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .card .phone {
      font-size: 1rem;
      color: #555;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    .card a.resume-btn {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    .card a.resume-btn:hover {
      opacity: 0.4;
    }

    nav {
      position: fixed;
      bottom: 2rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #111;
    }

    nav a.artwork-link {
      color: #999;
    }
    nav a.artwork-link:hover {
      color: #111;
    }
  </style>
</head>
<body>

    <img src="graphics/amusicianstory.png" alt="A Musician's Story" style="max-width: 700px; width: 90vw; margin-bottom: 2.5rem; display: block; margin-left: auto; margin-right: auto; border: 1px solid #111;">

    <p class="phone">(760) 642-8634</p>
    <a class="resume-btn" href="photos/link/ivan_torriani_rsme.pdf" download>Download Résumé</a>
