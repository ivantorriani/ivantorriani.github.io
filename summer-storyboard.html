<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Storyboard</title>
  <link rel="stylesheet" href="css/style.css">

<body>

    <nav>

  <main class="storyboard-container">
    <article class="storyboard-panel">
      <img src="photos/studies/summer_study/expo_study.png" alt="Expo study">

  <footer>
    <p>&copy; 2025 Ivan</p>
